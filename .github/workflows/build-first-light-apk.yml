name: Build EXGINE First Light APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'include/**'
      - 'src/**'
      - 'examples/first_3d_game/**'
      - 'platform/android/**'
      - '.github/workflows/build-first-light-apk.yml'

jobs:
  android-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout EXGINE
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android build dependencies
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            'platform-tools' \
            'platforms;android-35' \
            'build-tools;35.0.0' \
            'ndk;27.2.12479018' \
            'cmake;3.22.1'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release APK
        working-directory: platform/android
        run: gradle --no-daemon clean assembleRelease

      - name: Verify APK artifact
        run: |
          test -f platform/android/app/build/outputs/apk/release/app-release-unsigned.apk
          ls -lh platform/android/app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Upload First Light APK
        uses: actions/upload-artifact@v4
        with:
          name: exgine-first-light-apk
          path: platform/android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error
          retention-days: 14
