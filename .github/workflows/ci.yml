name: EXGINE CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Showcase benchmark
        run: ./build/exgine_showcase examples/showcase | tee showcase-metrics.txt

      - name: Upload showcase metrics
        uses: actions/upload-artifact@v4
        with:
          name: exgine-showcase-metrics
          path: showcase-metrics.txt
