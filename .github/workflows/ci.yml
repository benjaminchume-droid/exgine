name: EXGINE CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        working-directory: build
        run: ctest --output-on-failure

      - name: Validate generated 3D art resource
        run: |
          test -s build/generated_art/exworld_test_car.obj
          test -s build/generated_art/exworld_test_car.mtl
          grep -q '^o Body$' build/generated_art/exworld_test_car.obj
          grep -q '^newmtl CarPaint$' build/generated_art/exworld_test_car.mtl

      - name: Upload real 3D art resource
        uses: actions/upload-artifact@v4
        with:
          name: exgine-real-3d-test-resource
          path: |
            build/generated_art/exworld_test_car.obj
            build/generated_art/exworld_test_car.mtl

      - name: Showcase benchmark
        run: ./build/exgine_showcase examples/showcase | tee showcase-metrics.txt

      - name: Upload showcase metrics
        uses: actions/upload-artifact@v4
        with:
          name: exgine-showcase-metrics
          path: showcase-metrics.txt
