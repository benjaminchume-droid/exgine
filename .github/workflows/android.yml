name: EXGINE Android

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  android-showcase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sdkmanager "platforms;android-35" "build-tools;35.0.0" "ndk;27.2.12479018" "cmake;3.22.1"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK and release bundle
        working-directory: platform/android
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: exgine-android-showcase
          path: |
            platform/android/app/build/outputs/apk/debug/*.apk
            platform/android/app/build/outputs/bundle/release/*.aab
